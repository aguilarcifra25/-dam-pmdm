<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer src="index.js"></script>
</head>

<body>

    <h1 class="m-4">Gestor de notas</h1>

    <button type="button" class="btn btn-primary m-4 mt-2" data-bs-toggle="modal" data-bs-target="#modalAdd">Añadir
        nota</button>

    <div class="container" id="contenedor">
        <div class="row"></div>

    </div>


    <div class="modal" id="modalAdd">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Añadir nota</h4>

                </div>

                <!-- Modal body -->
                <div class="modal-body">
                    <p> Titulo: </p>
                    <input type="text" id="text" class="my-2">

                    <div class="d-flex">

                        <div class="me-5">
                            <p>Ancho</p>
                            <select id="ancho">
                                <option>Small</option>
                                <option>Medium</option>
                                <option>High</option>
                            </select>
                        </div>

                        <div>
                            <p>Color</p>
                            <select id="color">
                                <option>Rojo</option>
                                <option>Verde</option>
                                <option>Azul</option>
                                <option>Amarillo</option>
                            </select>

                        </div>

                    </div>

                </div>

                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="addNota">Añadir</button>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
