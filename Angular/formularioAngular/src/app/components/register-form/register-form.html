<div class="container mt-5">
    <h2 class="my-4">Registro</h2>

    <div class="form-field mt-5">

        <div class="row">
            <div class="col-3">
                <label for="fieldText" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="fieldText" placeholder="Nombre" [(ngModel)]="nombre">
            </div>
            <div class="col-3">
                <label for="fieldText" class="form-label">Primer apellido</label>
                <input type="text" class="form-control" id="fieldText" placeholder="Primer apelido"
                    [(ngModel)]="apellido1">
            </div>
            <div class="col-3">
                <label for="fieldText" class="form-label">Segundo apellido</label>
                <input type="text" class="form-control" id="fieldText" placeholder="Segundo apellido"
                    [(ngModel)]="apellido2">
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-3">
                <label for="fieldText" class="form-label">Email</label>
                <input type="email" class="form-control" id="fieldText" placeholder="Email" [(ngModel)]="email">
            </div>
            <div class="col-2">
                <label for="fieldText" class="form-label">NIF</label>
                <input type="text" class="form-control" id="fieldText" [(ngModel)]="nif">
            </div>
            <div class="col-2">
                <label for="fieldText" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="fieldText" placeholder="123456789" [(ngModel)]="tel">
            </div>
            <div class="col-2">
                <label for="fieldText" class="form-label">Sexo</label>
                <select class="form-select" id="fieldText" [(ngModel)]="sexo">
                    <option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-3">
                <label for="fieldText" class="form-label">Contraseña</label>
                <input type="text" class="form-control" id="fieldText" [(ngModel)]="pw">
            </div>
            <div class="col-3">
                <label for="fieldText" class="form-label">Repetir contraseña</label>
                <input type="text" class="form-control" id="fieldText" [(ngModel)]="pwRepe">
            </div>
            <div class="col-3">
                <label for="fieldText" class="form-label">Indique cómo conocio la página</label>
                <select class="form-select" id="fieldText" [(ngModel)]="conocePag">
                    <option value="hombre">Buscando en Google</option>
                    <option value="mujer">A través de un amigo</option>
                    <option value="otro">Por mi profesor</option>
                </select>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="invalidCheck" [(ngModel)]="terYcond"
                        required>
                    <label class="form-check-label" for="invalidCheck">
                        Aceptar términos y condiciones
                    </label>
                </div>
            </div>

        </div>


        <button type="button" (click)="sendForm()" class="theme-primary btn btn-primary btn-solid btn-styled mt-3">
            Enviar formulario
        </button>
    </div>
