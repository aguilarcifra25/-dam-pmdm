<div class="modal-header">
    <h4 class="modal-title">Character details</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    <div class="text-center mb-4">
        <h3>{{ characterDetail?.name}}</h3>
    </div>
    <h6>Height: {{characterDetail?.height}} - Mass: {{characterDetail?.mass}}</h6>
    <p>Birth year: {{characterDetail?.birth_year}}</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-danger" (click)="activeModal.close()">Close</button>
</div>
