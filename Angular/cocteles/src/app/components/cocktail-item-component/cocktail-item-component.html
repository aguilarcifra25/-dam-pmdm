<div class="card" style=" max-width: 25rem;">
    <img src={{cocktail()?.strDrinkThumb}} class="card-img-top" alt="Bebida">
    <div class="card-body">
        <h5 class="card-title">{{cocktail()?.strDrink}}</h5>
        <p class="card-text">Categoria: {{cocktail()?.strCategory}}</p>
        <p class="card-text">Alcohólico: {{cocktail()?.strAlcoholic}}</p>
        <p class="card-text">Instrucciones: {{cocktail()?.strInstructions}}</p>
    </div>
</div>
