<div class="m-5 container">

    <div class="row d-flex flex-column">

        <div id="result" class="mb-3 pe-0 col-1">
            {{result}}
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-secondary text-center" style="width: 40px;" id="7">7</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="8">8</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="9">9</button>
            <button type="button" class="btn btn-primary" style="width: 40px;" id="+">+</button>
        </div>
        <div class="d-flex gap-2 my-3">
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="4">4</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="5">5</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="6">6</button>
            <button type="button" class="btn btn-primary" style="width: 40px;" id="-">-</button>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="1" (click)="addNum()">1</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="2">2</button>
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="3">3</button>
            <button type="button" class="btn btn-success" style="width: 40px;" id="=">=</button>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="button" class="btn btn-secondary" style="width: 40px;" id="0">0</button>
        </div>

    </div>

</div>
