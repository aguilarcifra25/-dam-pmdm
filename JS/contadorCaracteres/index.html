<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="index.js"></script>
</head>

<body class="m-3">

    <h1 class="text-center">Contador de texto</h1>

    <div class="container d-flex justify-content-center">
        <textarea id="texto" class="mt-4" rows="10" cols="60"></textarea>
    </div>

    <div class="row text-center mt-5">
        <p class="col-3">Caracteres: <span id="caracteres">0</span></p>
        <p class="col-3">Palabras: <span id="palabras">0</span></p>
        <p class="col-3">Caracteres sin espacios: <span id="sinEspacios">0</span></p>
        <p class="col-3">Párrafos: <span id="parrafos">0</span></p>
    </div>


</body>

</html>
