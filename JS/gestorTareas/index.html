<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="index.js"></script>
</head>

<body class="container mt-3">

    <h1 class="mb-5">Gestor de tareas</h1>

    <p>Total de tareas: <span id="totalTareas"></span></p>
    <p>Total completas: <span id="totalCompletas"></span></p>

    <div class="row">
        <textarea rows="4" cols="50" class="col-12" id='text' placeholder="Escribe aqui tu tarea"></textarea>
        <button class="btn btn-primary mt-3 col-2" id="addTarea">Añadir tarea</button>
        <button class="btn btn-danger mt-3 mx-4 col-2" id="delCompletas">Eliminar completadas</button>
        <button class="btn btn-danger mt-3 col-2" id="delLista">Eliminar lista</button>
    </div>

    <ul class="border p-3 mt-5">

    </ul>

</body>

</html>
